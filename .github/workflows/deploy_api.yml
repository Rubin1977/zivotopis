name: Deploy to PythonAnywhere via API

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Reload PythonAnywhere web app
      run: |
        curl -X POST \
          -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
          https://www.pythonanywhere.com/api/v0/user/RastislavRuzbacky/webapps/rastislavruzbacky_eu_pythonanywhere_com/reload/
