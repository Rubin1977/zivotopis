name: Django tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django coverage

      - name: Run tests with pytest + coverage
        env:
          DJANGO_SETTINGS_MODULE: mysite.settings.test
        run: |
          coverage run -m pytest
          coverage report -m

  deploy:
    name: Deploy to PythonAnywhere
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger PythonAnywhere reload
        run: |
          curl -X POST https://eu.pythonanywhere.com/api/v0/user/${{ secrets.PA_USERNAME }}/webapps/${{ secrets.PA_APP_NAME }}/reload/ \
          -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}"



          

