{% load static %}
<!DOCTYPE html>
<html lang="sk">
    <head>
        <meta charset="utf-8" />
        <title>Rastislav Ružbacký | Životopis</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'css/favicon-logo.png' %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/zivotopis.css' %}">
        <link href="//fonts.googleapis.com/css?family=Roboto Mono&subset=latin,latin-ext" rel="stylesheet" type="text/css">
    </head>
    <div class="row">
        <div class="col">
            <div class="contact-info-frame">
                <p>Môžete ma kontaktovať pomocou nižšie uvedeného formulára: </p>
            </div><br>    
        <form method="post" action="{% url 'send_email' %}">   
            {% csrf_token %}
            <div>
                <label for="{{ form.sender_name.id_for_label }}" class="form-label"> {{ form.sender_name.label }} </label><br>
                {{ form.sender_name }}
            </div>
            <div>
                <label for="{{ form.sender_email.id_for_label }}" class="form-label"> {{ form.sender_email.label }} </label><br>
                {{ form.sender_email }}
            </div>
            <div>
                <label for="{{ form.subject.id_for_label }}" class="form-label"> {{ form.subject.label }} </label><br>
                {{ form.subject }}
            </div>
            <div>
                <label for="{{ form.message.id_for_label }}" class="form-label"> {{ form.message.label }} </label><br>
                {{ form.message }} 
            </div>
            <div>
                <button class="btn btn-secondary" type="submit" style="float: left" >Odoslať</button>
                <a class="btn btn-primary" href="/" data-toggle="tooltip" data-placement="right" title="Návrat späť"> {% include 'zivotopis/icons/house-fill.svg' %} Home
                </a>
            </div>
        </form>
    </div>
</html>
