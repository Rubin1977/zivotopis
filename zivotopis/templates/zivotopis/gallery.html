{% extends 'zivotopis/base.html' %}
{% load static %}

{% block content %}
<div class="gallery">
    <h2>Vozgézy na severovýchode Francúzka v Novemberi 2024</h2>
    <div class="slides">
        {% for item in items %}
        <div class="slide-item">
            <h3>{{ item.title }}</h3>
            <img src="{{ item.image.url }}" alt="{{ item.title }}" loading="lazy">
            <p>{{ item.description }}</p>  
        </div>
        {% empty %}
        <p>Žiadne obrázky v galérii zatiaľ nie sú.</p>
        {% endfor %}
    </div>
    <div id="gallery-modal" class="modal-custom">
        <div class="modal-inner">
            <span id="gallery-close" class="close-button">&times;</span>
            <h3 id="modal-title"></h3>
            <img id="gallery-image" class="modal-content-custom" alt="Zväčšený obrázok">
            <p id="modal-description"></p>
            <button id="gallery-prev" class="prev">&#10094;</button>
            <button id="gallery-next" class="next">&#10095;</button>
        </div>
    </div>
</div>
{% endblock %}
