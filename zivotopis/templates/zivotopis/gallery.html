{% extends 'zivotopis/base.html' %}
{% load static %}

{% block content %}
<div class="gallery">
    <h2>Vozgézy na severovýchode Francúzka v Novemberi 2024</h2>
    <div class="slides">
        {% for item in items %}
        <div class="slide-item">
            <h3>{{ item.title }}</h3>
            <img src="{{ item.image.url }}" alt="{{ item.title }}">
            <p>{{ item.description }}</p>  
        </div>
        {% empty %}
        <p>Žiadne obrázky v galérii zatiaľ nie sú.</p>
        {% endfor %}
    </div>

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>
</div>
{% endblock %}
