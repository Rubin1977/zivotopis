{% extends "zivotopis/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-3">🧪 Testovacie rozhranie</h2>
    <p class="text-center">Spusti automatické testy pre svoj Django projekt.</p>

    <div class="text-center mb-3">
    <label for="test-selector" class="form-label">Vyber testovaciu skupinu:</label>
    <select id="test-selector" class="form-select text-center" style="max-width:300px;margin:auto;">
        <option value="zivotopis">Všetky testy</option>
        <option value="zivotopis.tests.test_save.test_forms">Formuláre</option>
        <option value="zivotopis.tests.test_save.test_urls">URL</option>
    </select>
    </div>

    <div class="text-center">
        <button id="run-tests-btn" class="btn btn-primary">Spustiť testy</button>
    </div>

    <!-- Spinner -->
    <div id="loading" class="text-center mt-3" style="display:none;">
        <div class="spinner-border text-primary" role="status"></div>
        <p>Prebieha testovanie...</p>
    </div>

    <!-- Výstup -->
    <pre id="test-output" class="text-start bg-dark text-light p-3 rounded mt-4"
         style="white-space: pre-wrap; display:none; font-size:0.9rem; border-left:5px solid transparent; max-height:500px; overflow-y:auto;"></pre>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("run-tests-btn");
    const loading = document.getElementById("loading");
    const output = document.getElementById("test-output");

    btn.addEventListener("click", async () => {
        btn.disabled = true;
        loading.style.display = "block";
        output.style.display = "none";
        output.textContent = "";

        try {
            const selector = document.getElementById("test-selector");
            const selectedTest = selector.value;

            const response = await fetch("{% url 'run_tests_api' %}?target=" + encodeURIComponent(selectedTest));

            const data = await response.json();

            loading.style.display = "none";
            output.style.display = "block";
            btn.disabled = false;


            let combinedOutput = (data.stdout || "") + "\n" + (data.stderr || "");

            // 📊 Výpočet štatistiky testov (pred zvýraznením)
            const passed = (combinedOutput.match(/\.{3} ok/g) || []).length;
            const failed = (combinedOutput.match(/\.{3} FAIL/g) || []).length;
            const errored = (combinedOutput.match(/\.{3} ERROR/g) || []).length;

            // zvýraznenie kľúčových slov farbami
            combinedOutput = combinedOutput
                .replace(/OK/g, "✅ <span style='color:#28a745;font-weight:bold'>OK</span>")
                .replace(/FAILED/g, "❌ <span style='color:#dc3545;font-weight:bold'>FAILED</span>")
                .replace(/ERROR/g, "⚠️ <span style='color:#ffc107;font-weight:bold'>ERROR</span>")
                .replace(/Ran (\d+) tests?/g, "<span style='color:#0dcaf0'>Ran $1 test(s)</span>");

            output.innerHTML = combinedOutput;

            // Zobrazenie štatistiky
            output.innerHTML += `
            <div class="mt-3">
                <strong>📊 Štatistika:</strong><br>
                ✅ Úspešné: ${passed}<br>
                ❌ Zlyhané: ${failed}<br>
                ⚠️ Chybné: ${errored}
            </div>
            `;

            if (data.success) {
                output.innerHTML += "\n✅ <strong style='color:#28a745'>Testy prebehli úspešne.</strong>";
                output.style.borderLeft = "5px solid #28a745";
            } else {
                output.innerHTML += "\n❌ <strong style='color:#dc3545'>Testy zlyhali.</strong>";
                output.style.borderLeft = "5px solid #dc3545";
            }

            // Automatické skrolovanie na koniec výstupu
            output.scrollTop = output.scrollHeight;

        } catch (error) {
            loading.style.display = "none";
            output.style.display = "block";
            btn.disabled = false;
            output.innerHTML =
                "⚠️ <strong style='color:#ffc107'>Chyba pri komunikácii so serverom:</strong><br>" + error;
            output.style.borderLeft = "5px solid #ffc107";
        }
    });
});
</script>
{% endblock %}
